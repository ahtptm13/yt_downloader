name: Check

# Quick compile check on every push, so a broken build shows up
# before anyone runs a release.

on:
  push:
    branches-ignore: ['release', 'update-locks']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: 'src-tauri -> target'

      - name: Frontend syntax
        run: node --check src/app.js

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Core logic tests
        working-directory: src-tauri
        run: cargo test --lib --locked
